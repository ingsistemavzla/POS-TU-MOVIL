services:
  - type: web
    name: todo-bcv-pos
    env: static
    # npm ci: build reproducible (no cambia funcionalidad)
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      # Assets con hash de Vite: cache largo (solo rendimiento de red)
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Shell SPA: no cachear index para siempre recibir el deploy nuevo
      - path: /index.html
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
      # Asegurar que 404.html se use para errores
      - type: rewrite
        source: /404
        destination: /404.html

